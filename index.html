<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body style="margin:0">
<title>Home Sweet Farm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700&display=swap">
<style>
  /* Layout: one phone-shaped game stage centred on a lake-blue background, title above, hint below. */
  :root {
    --dusk: #0b3f6e;
    --dusk-2: #1e7fd9;
    --cream: #f6ecdc;
    --muted: #bfe3ff;
    --tomato: #e8553f;
    --basil: #6bbf59;
    --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    --body: "Nunito", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, var(--dusk-2), var(--dusk) 70%);
    color: var(--cream);
    font-family: var(--body);
    display: flex; flex-direction: column; align-items: center;
    gap: 10px;
    padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  header { text-align: center; display: flex; flex-direction: column; gap: 2px; }
  h1 { font-family: var(--display); font-weight: 600; font-size: 28px; margin: 0; letter-spacing: 0.5px; text-wrap: balance; }
  h1 span { color: var(--tomato); }
  .sub { font-size: 13px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; }
  .stage {
    position: relative;
    /* Portrait stage: as tall as the screen allows, never wider than the screen (phone, tablet, computer). */
    width: min(100%, calc((100dvh - 130px) * 9 / 16), 520px);
    aspect-ratio: 9 / 16;
    flex: 0 0 auto;
    border-radius: 18px;
    overflow: hidden;
    background: #0b3f6e;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45), 0 0 0 3px rgba(246, 236, 220, 0.08);
  }
  #unity-canvas { width: 100%; height: 100%; display: block; background: #0b3f6e; outline: none; }
  .loading {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #0b3f6e; text-align: center; padding: 24px;
  }
  .loading .crate { font-family: var(--display); font-size: 22px; }
  /* 21/11: a little drawn scene (lake, hut, sun), a tomato riding the bar, and rotating tips while the game loads. */
  .scene { width: 72%; max-width: 300px; }
  .scene .sun { animation: sun 4s ease-in-out infinite alternate; transform-origin: 230px 40px; }
  .scene .wave { animation: wave 3s ease-in-out infinite alternate; }
  @keyframes sun { from { transform: scale(0.94); } to { transform: scale(1.06); } }
  @keyframes wave { from { transform: translateX(-6px); } to { transform: translateX(6px); } }
  .bar { position: relative; width: 70%; height: 12px; border-radius: 6px; background: rgba(246, 236, 220, 0.12); overflow: visible; }
  .bar i { display: block; height: 100%; width: 0%; border-radius: 6px; background: linear-gradient(90deg, var(--basil), var(--tomato)); transition: width 0.2s; }
  .bar b { position: absolute; top: 50%; left: 0%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff8a73, var(--tomato) 60%); box-shadow: 0 2px 6px rgba(0,0,0,0.35); transition: left 0.2s; }
  .bar b::after { content: ""; position: absolute; top: -5px; left: 7px; width: 8px; height: 7px; border-radius: 50% 50% 0 0; background: var(--basil); }
  .tip { min-height: 2.6em; max-width: 30ch; font-size: 14px; color: var(--cream); opacity: 0.9; transition: opacity 0.4s; }
  @media (prefers-reduced-motion: reduce) { .scene .sun, .scene .wave { animation: none; } }
  .pct { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .error { color: #ffb4a6; font-size: 14px; max-width: 32ch; }
  footer { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 13px; color: var(--muted); }
  button {
    font-family: var(--body); font-weight: 700; font-size: 13px;
    color: var(--cream); background: rgba(246, 236, 220, 0.1);
    border: 1px solid rgba(246, 236, 220, 0.25); border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  button:hover { background: rgba(246, 236, 220, 0.18); }
  button:focus-visible { outline: 2px solid var(--tomato); outline-offset: 2px; }
  /* Full screen (20/11): real fullscreen where the browser allows it (Android, computer); on iPhone, where pages
     cannot go fullscreen, the game simply takes the whole screen (title and hint hidden) with a close button. */
  body.fs header, body.fs footer { display: none; }
  body.fs { padding: 0; gap: 0; overflow: hidden; }
  body.fs .stage { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; max-width: none; aspect-ratio: auto; border-radius: 0; box-shadow: none; z-index: 20; }
  #fs-exit { display: none; position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); right: 10px; z-index: 30; width: 40px; height: 40px; padding: 0; border-radius: 50%; font-size: 18px; line-height: 40px; background: rgba(11, 30, 54, 0.55); color: #fff; border: 0; }
  body.fs #fs-exit { display: block; }
</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<header>
  <h1>Home Sweet <span>Farm</span></h1>
  <div class="sub">Sweet Lake · Âge 1 · La cabane</div>
</header>

<div class="stage" id="stage">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div class="loading" id="loading">
    <svg class="scene" viewBox="0 0 300 170" aria-hidden="true">
      <circle class="sun" cx="230" cy="40" r="22" fill="#ffd45a"/>
      <path d="M0 110 Q150 80 300 110 L300 170 L0 170 Z" fill="#6bbf59"/>
      <path class="wave" d="M-10 140 Q30 130 70 140 T150 140 T230 140 T310 140 L310 170 L-10 170 Z" fill="#3aa8e8"/>
      <rect x="110" y="72" width="60" height="38" rx="3" fill="#9a6a43"/>
      <path d="M102 76 L140 50 L178 76 Z" fill="#c9553f"/>
      <rect x="133" y="88" width="14" height="22" rx="2" fill="#f2b45c"/>
      <rect x="116" y="82" width="12" height="10" rx="1" fill="#bfe3ff"/>
      <circle cx="70" cy="104" r="5" fill="#e8553f"/><circle cx="82" cy="106" r="5" fill="#e8553f"/><circle cx="210" cy="104" r="5" fill="#e8553f"/>
    </svg>
    <div class="crate">La cabane se prépare…</div>
    <div class="bar"><i id="bar"></i><b id="tomate"></b></div>
    <div class="pct" id="pct">0 %</div>
    <div class="tip" id="tip">Astuce : récolte, vends au stand et répare la cabane pour faire renaître le lac.</div>
    <div class="error" id="error" hidden></div>
  </div>
</div>

<footer>
  <span>Clique et fais glisser pour déplacer Eden</span>
  <button id="fs" type="button">Plein écran</button>
</footer>
<button id="fs-exit" type="button" aria-label="Quitter le plein écran">✕</button>

<script>var HSF_VERSION = "20261122-1548";</script>
<script>document.write('<script src="Build/Web.loader.js?v=' + HSF_VERSION + '"><\/script>');</script>
<script>
  (function () {
    var canvas = document.getElementById("unity-canvas");
    var bar = document.getElementById("bar");
    var pct = document.getElementById("pct");
    var loading = document.getElementById("loading");
    var error = document.getElementById("error");
    var tomate = document.getElementById("tomate");
    var instance = null;
    // Tips while the game loads (21/11).
    var tips = [
      "Astuce : récolte, vends au stand et répare la cabane pour faire renaître le lac.",
      "Astuce : choisis ton compagnon : il ramène l'argent du stand pendant que tu travailles.",
      "Astuce : un coffre t'attend chaque jour près de la cabane.",
      "Astuce : les défis de rythme rapportent une belle prime si tu vas vite.",
      "Astuce : le chariot d'Eden porte encore plus de produits d'un coup.",
      "Astuce : le bouton appareil photo garde un souvenir de ta ferme."
    ];
    var tipEl = document.getElementById("tip"), tipI = 0;
    var tipTimer = setInterval(function () {
      tipEl.style.opacity = 0;
      setTimeout(function () { tipI = (tipI + 1) % tips.length; tipEl.textContent = tips[tipI]; tipEl.style.opacity = 0.9; }, 400);
    }, 3500);

    function fail(msg) {
      error.hidden = false;
      error.textContent = "Le jeu n'a pas pu démarrer : " + msg;
    }

    if (typeof createUnityInstance !== "function") { fail("le chargeur du jeu est introuvable."); return; }

    createUnityInstance(canvas, {
      arguments: [],
      // Phones render at 3x pixels by default: capped so the game stays fluid (sharp enough on a phone screen).
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),   // same sharpness on phones as on computers (20/11: « même rendu que dans Unity »)
      // Gzip files published under a .wasm name (a type the host serves); the loader unzips them itself.
      dataUrl: "Build/hsf-data.wasm?v=" + HSF_VERSION,
      frameworkUrl: "Build/hsf-framework.wasm?v=" + HSF_VERSION,
      codeUrl: "Build/hsf-code.wasm?v=" + HSF_VERSION,
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Home Sweet Farm",
      productName: "Home Sweet Farm",
      productVersion: "0.1",
      autoSyncPersistentDataPath: true,
      showBanner: function (msg, type) { if (type === "error") fail(msg); },
    }, function (p) {
      var v = Math.round(p * 100);
      bar.style.width = v + "%";
      tomate.style.left = v + "%";
      pct.textContent = v + " %";
    }).then(function (inst) {
      instance = inst;
      clearInterval(tipTimer);
      loading.hidden = true;
      canvas.focus();
    }).catch(function (e) { fail(e && e.message ? e.message : String(e)); });

    // Full screen: the real one where it exists (Android, computer), else the game takes the whole page (iPhone).
    var stage = document.getElementById("stage");
    function fit() { setTimeout(function () { window.dispatchEvent(new Event("resize")); }, 60); }
    function enterFs() {
      document.body.classList.add("fs");
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) { try { var p = req.call(el); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
      fit();
    }
    // 22/11 : sur téléphone, le jeu passe en plein écran tout seul au premier toucher.
    var autoFsDone = false;
    var coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    if (coarse) document.addEventListener("pointerdown", function () { if (autoFsDone) return; autoFsDone = true; if (!document.body.classList.contains("fs")) enterFs(); }, { once: true, capture: true });
    function exitFs() {
      document.body.classList.remove("fs");
      var ex = document.exitFullscreen || document.webkitExitFullscreen;
      if ((document.fullscreenElement || document.webkitFullscreenElement) && ex) { try { ex.call(document); } catch (e) {} }
      fit();
    }
    document.getElementById("fs").addEventListener("click", enterFs);
    document.getElementById("fs-exit").addEventListener("click", exitFs);
    document.addEventListener("fullscreenchange", function () { if (!document.fullscreenElement) { document.body.classList.remove("fs"); fit(); } });
  })();
</script>

</body>
</html>
